name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra dữ liệu JSON
        run: |
          python3 - <<'EOF'
          import json
          for b in json.load(open("docs/data/index.json", encoding="utf-8")):
              d = json.load(open("docs/data/" + b["file"], encoding="utf-8"))
              assert d, b["id"]
              for q in d:
                  if b["type"] == "mcq":
                      assert 0 <= q["ans"] < len(q["opts"]), (b["id"], q["id"])
                  else:
                      assert q["a"], (b["id"], q["id"])
              print(b["id"], len(d), "câu hợp lệ")
          EOF
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
