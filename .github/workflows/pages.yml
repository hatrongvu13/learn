name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra dữ liệu JSON
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("docs/data/questions.json", encoding="utf-8"))
          assert len(d) > 0
          for q in d:
              assert 0 <= q["ans"] < len(q["opts"]), q["id"]
          print(len(d), "câu hợp lệ")
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
